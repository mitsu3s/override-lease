---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: overrideleases.mitsu3s.dev
spec:
  group: mitsu3s.dev
  names:
    categories:
    - mitsu3s
    kind: OverrideLease
    listKind: OverrideLeaseList
    plural: overrideleases
    shortNames:
    - ol
    singular: overridelease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OverrideLease requests a temporary, reversible field override.
          A string column is intentional: Kubernetes renders future values in date
          columns as <invalid> because date columns represent elapsed time.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OverrideLeaseSpec defines the requested temporary override.
            properties:
              driftPolicy:
                default: FailOnDrift
                description: |-
                  DriftPolicy controls what happens when another actor changes an overridden field.
                  FailOnDrift rolls back all fields that are still safe to restore. Ignore waits
                  until expiry, but rollback still uses compare-and-swap semantics.
                enum:
                - FailOnDrift
                - Ignore
                type: string
              duration:
                description: |-
                  Duration is how long the lease may remain active after creation.
                  It accepts compound millisecond, second, minute, hour, day, and week units,
                  for example 30m, 12h, 7d, or 1w2d.
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h|d|w))+$
                type: string
                x-kubernetes-validations:
                - message: duration must be greater than zero
                  rule: self.matches('[1-9]')
              overrides:
                description: Overrides is immutable after creation.
                items:
                  properties:
                    path:
                      description: Path is an RFC 6901 JSON pointer to a supported
                        scalar field.
                      pattern: ^/
                      type: string
                    value:
                      description: Value is the temporary value. Objects and arrays
                        are intentionally rejected.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - path
                  - value
                  type: object
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - path
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: overrides are immutable
                  rule: self == oldSelf
              reason:
                description: Reason is required so that every override has an auditable
                  purpose.
                maxLength: 512
                minLength: 8
                type: string
              targetRef:
                description: TargetRef is immutable after creation.
                properties:
                  apiVersion:
                    minLength: 1
                    type: string
                  kind:
                    minLength: 1
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: targetRef is immutable
                  rule: self == oldSelf
                - message: apiVersion and kind must identify a supported target
                  rule: (self.apiVersion == 'apps/v1' && self.kind in ['Deployment',
                    'StatefulSet']) || (self.apiVersion == 'autoscaling/v2' && self.kind
                    == 'HorizontalPodAutoscaler') || (self.apiVersion == 'batch/v1'
                    && self.kind == 'CronJob') || (self.apiVersion == 'policy/v1'
                    && self.kind == 'PodDisruptionBudget')
              ticket:
                description: Ticket is an optional incident, change, or approval reference.
                maxLength: 256
                type: string
            required:
            - duration
            - overrides
            - reason
            - targetRef
            type: object
            x-kubernetes-validations:
            - message: override path is not supported for the selected target
              rule: (self.targetRef.apiVersion == 'apps/v1' && self.targetRef.kind
                in ['Deployment', 'StatefulSet'] && self.overrides.all(o, o.path ==
                '/spec/replicas')) || (self.targetRef.apiVersion == 'autoscaling/v2'
                && self.targetRef.kind == 'HorizontalPodAutoscaler' && self.overrides.all(o,
                o.path in ['/spec/minReplicas', '/spec/maxReplicas'])) || (self.targetRef.apiVersion
                == 'batch/v1' && self.targetRef.kind == 'CronJob' && self.overrides.all(o,
                o.path == '/spec/suspend')) || (self.targetRef.apiVersion == 'policy/v1'
                && self.targetRef.kind == 'PodDisruptionBudget' && self.overrides.all(o,
                o.path in ['/spec/minAvailable', '/spec/maxUnavailable']))
          status:
            description: OverrideLeaseStatus contains the controller-observed state.
            properties:
              appliedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              conflictingPaths:
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              expiresAt:
                description: ExpiresAt is the absolute expiry calculated from creation
                  time and spec.duration.
                format: date-time
                type: string
              fields:
                items:
                  description: FieldState records the value required to perform a
                    compare-and-swap rollback.
                  properties:
                    applied:
                      x-kubernetes-preserve-unknown-fields: true
                    original:
                      x-kubernetes-preserve-unknown-fields: true
                    originalPresent:
                      type: boolean
                    path:
                      type: string
                  required:
                  - applied
                  - originalPresent
                  - path
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - path
                x-kubernetes-list-type: map
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: OverrideLeasePhase is the controller-observed lifecycle
                  state.
                enum:
                - Pending
                - Prepared
                - Applied
                - Completed
                - Conflict
                - Invalid
                type: string
              rolledBackAt:
                format: date-time
                type: string
              targetUID:
                description: |-
                  UID is a type that holds unique ID values, including UUIDs.  Because we
                  don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                  intent and helps make sure that UIDs and names do not get conflated.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
